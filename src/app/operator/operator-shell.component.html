<div class="app-shell operator-theme">
  <header class="topbar">
    <a class="operator-brand" routerLink="/operator/campaigns" aria-label="L’agence visible campaigns">
      <span class="operator-mark" aria-hidden="true">v.</span>
      <span>L’agence visible <small>Business evaluation</small></span>
    </a>
    <nav class="primary-nav" aria-label="Operator navigation">
      <a routerLink="/operator/campaigns" routerLinkActive="active" ariaCurrentWhenActive="page">Campaigns</a>
      <a routerLink="/operator/locations" routerLinkActive="active" ariaCurrentWhenActive="page">Locations</a>
      <a routerLink="/operator/configuration" routerLinkActive="active" ariaCurrentWhenActive="page">Configuration</a>
    </nav>
    <button class="logout-button" type="button" (click)="logout()" [disabled]="loggingOut()">{{ loggingOut() ? 'Logging out…' : 'Log out' }}</button>
  </header>
  @if (logoutError()) { <p class="logout-error" role="alert">{{ logoutError() }}</p> }
  <div class="main" id="operator-main"><router-outlet /></div>
</div>
