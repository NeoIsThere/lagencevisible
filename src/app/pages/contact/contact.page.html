<section class="section" aria-labelledby="contact-title">
  <div class="container contact-layout">
    <aside class="contact-aside">
      <nav class="breadcrumb" [attr.aria-label]="i18n.t('Fil d’Ariane', 'Breadcrumb')"><a routerLink="/">{{ i18n.t('Accueil', 'Home') }}</a><span>/</span><span>Contact</span></nav>
      <h1 id="contact-title">{{ i18n.t('Parlons de votre', 'Let’s talk about your') }} <span class="accent">{{ i18n.t('site web.', 'website.') }}</span></h1>
      <p class="lead">{{ i18n.t('Une question ou un projet ? Écrivez-nous.', 'Have a question or a project? Email us.') }}</p>
    </aside>
    <div class="contact-card">
      <a class="button" [href]="'mailto:' + site.email">{{ i18n.t('Envoyer un email', 'Send an email') }} <span aria-hidden="true">↗</span></a>
    </div>
  </div>
</section>
