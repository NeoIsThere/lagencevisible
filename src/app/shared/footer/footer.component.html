<footer class="site-footer" id="site-footer">
  <div class="container footer-main">
    <div class="footer-intro">
      <a class="brand brand-light" routerLink="/"><span class="brand-mark" aria-hidden="true"><span></span></span><span>{{ site.brand }}</span></a>
      <span class="footer-owner">{{ site.legal.ownerName }} — {{ site.legal.legalForm }}</span>
      <span>{{ site.location }}</span>
    </div>
    <nav class="footer-links" [attr.aria-label]="i18n.t('Liens du pied de page', 'Footer links')">
      <a routerLink="/mentions-legales">{{ i18n.t('Mentions légales', 'Legal notice') }}</a>
      <a routerLink="/politique-confidentialite">{{ i18n.t('Politique de confidentialité', 'Privacy policy') }}</a>
      <a routerLink="/contact">Contact</a>
    </nav>
  </div>
</footer>
